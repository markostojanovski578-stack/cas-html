<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Pluralsight</title>
    <link rel="stylesheet" href="practice.css">
</head>
<body>
    <div class="wrapper">
        <div class="left">
            <div class="signin">
                <div class="logo">
                    <img src="ps3.png" alt="Pluralsight">
                    <h2>PLURALSIGHT</h2>
                </div>
                  <form> 
                    <div>
                        <label>Email or Username</label>
                        <input type="text" class="text-input">
                    </div>
                    <div>
                        <label>Password</label>
                        <input type="Password" class="text-input">
                    </div>
                    <button type="submit" class="primary-btn">Sign In</button>
                  </form>
                  <div class="links">
                    <a href="#">Forgot Password</a>
                     <a href="#">Sign in with company or school</a>
                  </div>
                  <div class="or">
                    <hr class="bar">
                    <span>OR</span>
                    <hr class="bar">
                  </div>
                  
            </div>
            <a href="#" class="secondary-btn">Create an account</a>
             <footer class="main-footer">
            <p>Copyright &copy; 2026, PluralSight  All Rights Reserved</p>
            <div>
                <a href="">Terms of use</a> | <a href="">Privacy policy</a>
            </div>

        </footer>
        </div>
       

        <div class="right">
            <div class="showcase">
                <div class="showcase-content">
                    <h1 class="showcase-text">Lets create the future <strong>together</strong></h1>
                    <a href="#" class="secondary-btn1">Start a FREE-10 day trial</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
